<section id="terminal" class="py-32 bg-primary-bg relative overflow-hidden">
	<app-flowing-waves></app-flowing-waves>

	<div class="container mx-auto px-6 relative z-10">
		<app-section-title text="Try My Terminal"></app-section-title>

		<div class="max-w-4xl mx-auto mt-20">
			<div class="relative">
				<div class="rounded-md overflow-hidden border border-white/10 focus-within:border-accent-1/60 bg-secondary-bg shadow-lg transition-colors duration-300 font-mono">
					<div class="flex items-center gap-2 px-4 py-3 border-b border-white/10 bg-primary-bg" aria-hidden="true">
						<span class="w-3 h-3 rounded-full bg-white/20"></span>
						<span class="w-3 h-3 rounded-full bg-white/20"></span>
						<span class="w-3 h-3 rounded-full bg-white/20"></span>
						<span class="ml-3 text-xs text-text-secondary">kulsrestha — portfolio</span>
					</div>

					<div
						#body
						class="h-80 md:h-96 overflow-y-auto p-4 md:p-5 text-sm md:text-base leading-relaxed cursor-text"
						(click)="onBodyClick($event)"
					>
						<div role="log" aria-live="polite" aria-label="Terminal output">
							<div
								*ngFor="let line of lines"
								class="whitespace-pre-wrap break-words"
								[ngClass]="{
									'text-text-primary': line.kind === 'output',
									'text-red-400': line.kind === 'error'
								}"
							>
								<ng-container *ngIf="line.kind === 'command'; else result">
									<span class="text-accent-1">{{ prompt }}</span>&ngsp;<span class="text-text-primary">{{ line.text }}</span>
								</ng-container>

								<ng-template #result>{{ line.text }}<a
										*ngIf="line.link"
										[href]="line.link.href"
										target="_blank"
										rel="noreferrer"
										class="text-accent-1 underline hover:opacity-80"
									>{{ line.link.label }}</a></ng-template>
							</div>
						</div>

						<div class="flex items-center gap-2">
							<label for="terminal-input" class="text-accent-1 whitespace-nowrap">{{ prompt }}</label>
							<input
								#field
								id="terminal-input"
								type="text"
								[value]="input"
								(input)="onInput($event)"
								(keydown)="onKeydown($event)"
								autocomplete="off"
								autocapitalize="none"
								autocorrect="off"
								spellcheck="false"
								enterkeyhint="send"
								aria-label="Terminal command"
								placeholder="type a command"
								class="flex-1 min-w-0 bg-transparent border-none outline-none text-base text-text-primary placeholder:text-text-secondary/60 caret-accent-1"
							/>
						</div>
					</div>
				</div>

				<app-electric-sparks></app-electric-sparks>
			</div>

			<div class="mt-8 text-center">
				<p class="text-text-secondary mb-4">Not sure what to type? Try one of these:</p>

				<div class="flex flex-wrap justify-center gap-3">
					<button
						*ngFor="let hint of hints"
						type="button"
						(click)="runHint(hint)"
						[attr.aria-label]="'Run the ' + hint + ' command'"
						class="font-mono text-sm text-text-secondary bg-primary-bg border border-text-secondary/20 px-4 py-2 rounded-full hover:text-accent-1 hover:border-accent-1 focus-visible:text-accent-1 focus-visible:border-accent-1 outline-none transition-colors duration-300"
					>
						{{ hint }}
					</button>
				</div>

				<p class="hidden md:block mt-4 text-sm text-text-secondary/70">
					Tab completes a command · ↑ and ↓ browse your history
				</p>
			</div>
		</div>
	</div>
</section>
